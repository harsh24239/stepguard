name: Offline release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOCK_MODE: 'true'
      MODEL_PROVIDER: meta
      MODEL_MAX_RETRIES: '0'
      DETECTION_CACHE_SECONDS: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned dependencies
        run: python scripts/project.py setup
      - name: Verify offline release
        run: python scripts/project.py check
